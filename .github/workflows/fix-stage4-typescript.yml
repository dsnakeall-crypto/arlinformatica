name: Fix Stage 4 TypeScript

on:
  push:
    branches:
      - codex/implementar-finalizacao-da-os-e-pdf

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-finalizacao-da-os-e-pdf
      - name: Corrigir callback do useEffect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/js/main.tsx')
          text = path.read_text()
          old = 'useEffect(load,[id]);'
          new = 'useEffect(()=>{void load()},[id]);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Esperava 1 ocorrência, encontrei {count}')
          path.write_text(text.replace(old, new))
          PY
      - name: Remover workflow temporário
        run: git rm .github/workflows/fix-stage4-typescript.yml
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/main.tsx
          git commit -m "fix: corrigir useEffect da visualização da OS"
          git push origin HEAD:codex/implementar-finalizacao-da-os-e-pdf
