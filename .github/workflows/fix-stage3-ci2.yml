name: Fix Stage 3 CI Second Pass

on:
  push:
    branches:
      - codex/implementar-tela-de-configuracoes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-tela-de-configuracoes
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, fileinfo
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format PHP twice
        run: |
          vendor/bin/pint
          vendor/bin/pint
          vendor/bin/pint --test
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app routes tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: concluir formatação Pint da etapa 3"
            git push origin HEAD:codex/implementar-tela-de-configuracoes
          fi
