name: Finish current stage

on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[finish-stage]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-etapa-10-do-projeto
          fetch-depth: 0
      - name: Guard exact source state
        shell: bash
        run: |
          set -euo pipefail
          check(){ test "$(git hash-object "$1")" = "$2" || { echo "SHA mismatch: $1"; exit 1; }; }
          check resources/js/opening-whatsapp.ts 76b18dc4daf7a4e082081b90148870eb5a2f5464
          check app/Http/Controllers/FinalShareController.php e02fda1b8689a469afadae45074f243b34f07f26
          check routes/web.php 7d9e531a6b56aae5095889c154148b721a89cdf8
          check tests/Feature/FinalShareTest.php 6bcc220426b85ccc7be3ee73154fa7198824ef4c
          check app/Http/Controllers/FinalizationController.php fc7be5592c5fc5658ec073ff7b291457eeb3e0c6
          check app/Http/Controllers/ServiceOrderController.php a2af62a83ed080acb3f36396230f50f97e8bff28
          check tests/Feature/ServiceOrderWorkflowTest.php d0c91412c86ccfcfd994e32a565aa96e0f57e364
          check tests/e2e/post-sale-navigation.spec.ts a013e8bdafb2e3a31bbddfe7216d7c257073290b
          check tests/e2e/settings-editors.spec.ts 4eb000fb520c2b5f9aa62c2148bd20ecac91c0b8
      - name: Apply approved stage fixes
        run: python3 .github/scripts/finish-stage.py
      - name: Restore unmasked operational scenario
        run: git checkout 3a251c142ac9afe8c66de16f4492f2f6ac7c8cea -- tests/e2e/operation.spec.ts
      - name: Commit approved fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add resources/js/opening-whatsapp.ts app/Http/Controllers/FinalShareController.php routes/web.php tests/Feature/FinalShareTest.php app/Http/Controllers/FinalizationController.php app/Http/Controllers/ServiceOrderController.php tests/Feature/ServiceOrderWorkflowTest.php tests/e2e/post-sale-navigation.spec.ts tests/e2e/settings-editors.spec.ts tests/e2e/operation.spec.ts database/migrations/2026_09_06_190000_create_final_share_tokens_table.php
          git diff --cached --check
          git commit -m "fix(stage): concluir fluxo de status, mensagens e link final"
          git push origin HEAD:codex/implementar-etapa-10-do-projeto
