name: TEMP gerar lock Playwright
on:
  push:
    branches:
      - codex/adicionar-homologacao-final-e-e2e
permissions:
  contents: write
jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adicionar-homologacao-final-e-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-dev @playwright/test@1.55.0
      - name: Commitar package e lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nada a atualizar"
            exit 0
          fi
          git commit -m "chore: versionar Playwright no lockfile [lock-generated]"
          git push origin HEAD:codex/adicionar-homologacao-final-e-e2e
