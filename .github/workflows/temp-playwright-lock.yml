name: TEMP finalizar Playwright
on:
  push:
    branches:
      - codex/adicionar-homologacao-final-e-e2e
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/adicionar-homologacao-final-e-e2e
      - name: Limpar CI e atualizar documentação
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          text = text.replace('      - run: npm install --no-save @playwright/test@1.55.0\n', '')
          ci.write_text(text)

          checklist = Path('CHECKLIST_FINAL.md')
          text = checklist.read_text()
          old = '- [PENDENTE] Playwright configurado com SQLite isolado, seed próprio, servidor local, fluxo operacional principal, autorização por perfis e viewport mobile; a instalação/lockfile e a execução real ficaram bloqueadas por HTTP 403 do npm neste ambiente e não são marcadas como homologadas.'
          new = '- [OK] Playwright E2E versionado no `package.json`/`package-lock.json`, com SQLite isolado, seed próprio, servidor Laravel local, fluxo operacional principal, autorização por perfis, viewport mobile e `retries: 0`; execução real validada pelo GitHub Actions.'
          if old not in text:
              raise SystemExit('Linha Playwright esperada não encontrada no checklist')
          checklist.write_text(text.replace(old, new))

          continuity = Path('docs/CONTINUIDADE_CHATGPT.md')
          text = continuity.read_text()
          text = text.replace(
              'A Etapa 9 está implementada na branch `codex/etapa-9-homologacao-e2e-release` e aguarda PR e merge.',
              'A Etapa 9 está na PR #10, branch `codex/adicionar-homologacao-final-e-e2e`; backend, frontend e E2E já passaram juntos no GitHub Actions e a PR aguarda validação final das últimas correções e merge.'
          )
          text = text.replace(
              '**IMPLEMENTADA NA BRANCH / AGUARDANDO PR E MERGE.** A branch `codex/etapa-9-homologacao-e2e-release` adiciona ambiente Playwright isolado, cobertura de fluxo principal/perfis/mobile, job E2E, workflow manual de release e documentação de homologação.',
              '**IMPLEMENTADA NA PR #10 / AGUARDANDO MERGE.** A branch `codex/adicionar-homologacao-final-e-e2e` adiciona ambiente Playwright isolado, cobertura de fluxo principal/perfis/mobile, job E2E, workflow manual de release e documentação de homologação. O Playwright está versionado no lockfile, usa `retries: 0` e já teve execução real bem-sucedida no GitHub Actions.'
          )
          text = text.replace(
              '- testes E2E Playwright e testes funcionais finais do Projeto Mestre.',
              '- testes funcionais manuais finais do Projeto Mestre.'
          )
          text = text.replace(
              'Use a `main` real do GitHub como fonte. A Etapa 8 foi concluída e mergeada pela PR #9 no commit `c1704153861d31c056e7cc8fa663d876c210285b`, com CI verde. A Etapa 9 está implementada na branch `codex/etapa-9-homologacao-e2e-release` e aguarda PR/CI/merge. Leia todos os documentos obrigatórios e verifique o estado real antes de continuar.',
              'Use a `main` real do GitHub como fonte. A Etapa 8 foi concluída e mergeada pela PR #9 no commit `c1704153861d31c056e7cc8fa663d876c210285b`, com CI verde. A Etapa 9 está na PR #10, branch `codex/adicionar-homologacao-final-e-e2e`, com Playwright E2E versionado e execução real verde no GitHub Actions; a PR ainda não foi mergeada. Leia todos os documentos obrigatórios e verifique o estado real antes de continuar.'
          )
          continuity.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          old = 'O primeiro marco entrega modelagem relacional ampla, núcleo autenticado de clientes/OS, sequencial transacional, snapshots, limite de foto e uma interface responsiva fiel à direção visual. Consulte [`CHECKLIST_FINAL.md`](CHECKLIST_FINAL.md): itens não implementados estão explicitamente pendentes, sem mocks declarados como prontos.'
          new = 'O sistema já cobre as etapas funcionais de operação, documentos, financeiro, pós-venda, administração, backup/diagnóstico e Web Push no backend. A Etapa 9 acrescenta Playwright E2E e preparação manual de release. Consulte [`CHECKLIST_FINAL.md`](CHECKLIST_FINAL.md): validações externas ou ainda não concluídas permanecem explicitamente como `[PENDENTE]`.'
          if old not in text:
              raise SystemExit('Parágrafo de estado esperado não encontrado no README')
          readme.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/temp-playwright-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml CHECKLIST_FINAL.md README.md docs/CONTINUIDADE_CHATGPT.md
          git commit -m "chore: finalizar Playwright e documentação [final-cleanup]"
          git push origin HEAD:codex/adicionar-homologacao-final-e-e2e
