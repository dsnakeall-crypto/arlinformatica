name: Fix backend formatting

on:
  push:
    branches:
      - fix/ci-backend-pint
    paths:
      - .github/workflows/bootstrap-foundation.yml

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, fileinfo
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint twice and verify clean result
        run: |
          vendor/bin/pint
          vendor/bin/pint
          vendor/bin/pint --test

      - name: Remove temporary formatter workflow and commit fixes
        shell: bash
        run: |
          rm .github/workflows/bootstrap-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: finish Pint formatting and remove bootstrap workflow"
          git push
