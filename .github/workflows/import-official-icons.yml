name: Verificar ícones oficiais

on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto
    paths:
      - .github/workflows/import-official-icons.yml

permissions:
  contents: read

jobs:
  verify-icons:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verificar SHA-256 e Git blob dos cinco PNGs oficiais
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/icon-integrity.txt
          : > "$OUT"

          printf '%s  %s\n' \
            '6f1e2346d134ff79b3055d9a1c696050bd673c82560643d30ef43b790a9b6ee7' 'public/arl-assets/icons/icon-whatsapp.png' \
            'a33263e569c160c988af9f877e6ee145293c07683fcdd0cffc11d549b11e9303' 'public/arl-assets/icons/icon-maps.png' \
            '4373e954ba094ff508f90b639e280c01b7d440d7ef4cdd738469923272e41db7' 'public/arl-assets/icons/icon-editar.png' \
            '0f3a224fc2062c87a1a191ec2d26fc9c3b11c5d4c30e878c3b7265d65095acb1' 'public/arl-assets/icons/icon-lixeira.png' \
            'cf80a9872de95f0fa8ec9ff4ea1971f4ebaae3fac6fe704c24e9666290d1aae5' 'public/arl-assets/icons/icon-visualizar.png' | tee /tmp/expected-sha256.txt

          sha256sum -c /tmp/expected-sha256.txt | tee -a "$OUT"

          check_blob() {
            file="$1"
            expected="$2"
            actual="$(git hash-object "$file")"
            printf '%s git-blob=%s expected=%s\n' "$file" "$actual" "$expected" | tee -a "$OUT"
            test "$actual" = "$expected"
          }

          check_blob public/arl-assets/icons/icon-whatsapp.png 0731ac31fc7a3e37d9dba7313bed4aedd210ffad
          check_blob public/arl-assets/icons/icon-maps.png 35078f20806a52264b92604cd42d8d5ffaafe10e
          check_blob public/arl-assets/icons/icon-editar.png b619ff0f8abbe431f107299a6845f189350229ee
          check_blob public/arl-assets/icons/icon-lixeira.png 82ce86e3af86d81c745d2361807348d7cdb6bdd0
          check_blob public/arl-assets/icons/icon-visualizar.png 3dbf24d0b861321dbc9b5e5d4acc9d701848736c

          cp "$OUT" icon-integrity.txt

      - uses: actions/upload-artifact@v4
        with:
          name: icon-integrity-${{ github.sha }}
          path: icon-integrity.txt
          retention-days: 7
