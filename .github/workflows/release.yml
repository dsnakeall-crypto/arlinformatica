name: Preparar release
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mbstring, sqlite3, pdo_sqlite, gd, fileinfo, zip', coverage: none}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: npm run typecheck
      - run: npm run build
      - name: Montar pacote sem dados privados
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="arl-informatica-${GITHUB_SHA}"
          mkdir -p "release/${RELEASE}"
          rsync -a ./ "release/${RELEASE}/" --exclude='.git' --exclude='.github' --exclude='.env' --exclude='node_modules' --exclude='database/*.sqlite' --exclude='storage/app/private' --exclude='storage/logs/*' --exclude='storage/framework/cache/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='tests' --exclude='release'
          printf 'Projeto: ARL Informática\nCommit: %s\nData UTC: %s\nVersão: %s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_REF_NAME" > "release/${RELEASE}/RELEASE_MANIFEST.txt"
          tar -C release -czf "release/${RELEASE}.tar.gz" "${RELEASE}"
      - uses: actions/upload-artifact@v4
        with: {name: 'arl-informatica-${{ github.sha }}', path: 'release/*.tar.gz', if-no-files-found: error, retention-days: 14}
