name: Preparar release
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP for release checks without OPcache
        uses: shivammathur/setup-php@v2
        with: {php-version: '8.2', extensions: 'mbstring, sqlite3, pdo_sqlite, gd, fileinfo, zip, :opcache', coverage: none}
      - name: Verificar runtime PHP do E2E
        run: |
          php -v
          if php -m | grep -Fxq 'Zend OPcache'; then
            echo 'Zend OPcache deve permanecer desabilitado durante o E2E do release.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked --no-dev
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Preparar ambiente de teste
        run: |
          cp .env.example .env
          touch database/database.sqlite
          {
            echo 'DB_CONNECTION=sqlite'
            echo "DB_DATABASE=${GITHUB_WORKSPACE}/database/database.sqlite"
            echo 'SESSION_DRIVER=array'
            echo 'CACHE_STORE=array'
            echo 'QUEUE_CONNECTION=sync'
          } >> .env
          php artisan key:generate
      - run: php artisan migrate --seed --force
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            storage/logs/laravel.log
          if-no-files-found: warn
          retention-days: 7
      - name: Preparar dependências PHP de produção
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          composer check-platform-reqs --no-dev
      - name: Montar pacote sem dados privados
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="arl-informatica-${GITHUB_SHA}"
          mkdir -p "release/${RELEASE}"
          rsync -a ./ "release/${RELEASE}/" --exclude='.git' --exclude='.github' --exclude='.env' --exclude='node_modules' --exclude='database/*.sqlite' --exclude='storage/app/private' --exclude='storage/logs/*' --exclude='storage/framework/cache/*' --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' --exclude='tests' --exclude='playwright-report' --exclude='test-results' --exclude='release'
          printf 'Projeto: ARL Informática\nCommit: %s\nData UTC: %s\nVersão: %s\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_REF_NAME" > "release/${RELEASE}/RELEASE_MANIFEST.txt"
          tar -C release -czf "release/${RELEASE}.tar.gz" "${RELEASE}"
          sha256sum "release/${RELEASE}.tar.gz" > "release/${RELEASE}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with: {name: 'arl-informatica-${{ github.sha }}', path: 'release/*.tar.gz*', if-no-files-found: error, retention-days: 14}
