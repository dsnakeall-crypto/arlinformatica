name: PR11 targeted repair
on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-etapa-10-do-projeto
      - name: Apply verified targeted repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('resources/js/main.tsx')
          text = main.read_text()
          old = '<button id="finalization-action" className="primary" onClick={()=>setOpen(true)}>Concluir OS</button>'
          new = '<button id="finalization-action" className="primary" onClick={()=>{setOpen(true);api(`/orders/${order.id}/budgets`).then(setBudgets).catch(e=>setError(e.message))}}>Concluir OS</button>'
          if text.count(old) != 1:
              raise SystemExit(f'Finalization target count: {text.count(old)}')
          text = text.replace(old, new)
          if text.count('Aprovar e usar itens') != 1:
              raise SystemExit(f'Budget label count: {text.count("Aprovar e usar itens")}')
          text = text.replace('Aprovar e usar itens', 'Aprovar orçamento')
          if text.count("JSON.stringify({status:'approved',copy_items:true})") != 1:
              raise SystemExit('Expected copy_items approval payload not found exactly once')
          text = text.replace("JSON.stringify({status:'approved',copy_items:true})", "JSON.stringify({status:'approved'})")
          main.write_text(text)

          e2e = Path('tests/e2e/operation.spec.ts')
          test_text = e2e.read_text()
          if test_text.count('Aprovar e usar itens') != 3:
              raise SystemExit(f'E2E approval label count: {test_text.count("Aprovar e usar itens")}')
          test_text = test_text.replace('Aprovar e usar itens', 'Aprovar orçamento')
          e2e.write_text(test_text)

          finance = Path('app/Http/Controllers/FinanceController.php')
          finance.write_text(finance.read_text().rstrip() + '\n')
          PY
          git diff --check
      - name: Commit repair to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/main.tsx tests/e2e/operation.spec.ts app/Http/Controllers/FinanceController.php
          git commit -m 'fix: sincronizar orçamento aprovado na finalização'
          git push origin HEAD:codex/implementar-etapa-10-do-projeto
