name: Diagnose PHP SIGSEGV

on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto

jobs:
  e2e-core-php82:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, fileinfo, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Record PHP runtime before E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics core-dumps
          PHP_BIN="$(readlink -f "$(command -v php)")"
          {
            echo "=== date ==="
            date -u --iso-8601=seconds
            echo "=== php binary ==="
            echo "$PHP_BIN"
            echo "=== php -v ==="
            php -v
            echo "=== php --ini ==="
            php --ini
            echo "=== loaded modules ==="
            php -m
            echo "=== selected ini values ==="
            php -r 'foreach (["opcache.enable", "opcache.enable_cli", "opcache.jit", "memory_limit"] as $k) { printf("%s=%s\n", $k, var_export(ini_get($k), true)); }'
            echo "=== core settings before ==="
            cat /proc/sys/kernel/core_pattern
            cat /proc/sys/kernel/core_uses_pid
            echo "=== shell limits before ==="
            ulimit -a
            echo "=== php binary linkage ==="
            ldd "$PHP_BIN" || true
            echo "=== build id ==="
            readelf -n "$PHP_BIN" 2>/dev/null | grep -i 'Build ID' || true
          } | tee diagnostics/runtime-before.txt

      - name: Run E2E normally and inspect live PHP process
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/core-dumps" diagnostics
          CORE_PATTERN="$GITHUB_WORKSPACE/core-dumps/core.%e.%p.%t"

          {
            echo "core_pattern before=$(cat /proc/sys/kernel/core_pattern)"
            sudo sysctl -w "kernel.core_pattern=$CORE_PATTERN"
            echo "core_pattern after=$(cat /proc/sys/kernel/core_pattern)"
            ulimit -c unlimited
            echo "shell soft core=$(ulimit -Sc)"
            echo "shell hard core=$(ulimit -Hc)"
            echo "shell coredump_filter=$(cat /proc/self/coredump_filter)"
          } | tee diagnostics/core-setup.txt

          set +e
          CI=false npm run test:e2e &
          E2E_PID=$!
          set -e

          PHP_PID=""
          for _ in $(seq 1 150); do
            PHP_PID="$(pgrep -f 'php -S 127.0.0.1:8000' | head -n 1 || true)"
            if [[ -n "$PHP_PID" && -r "/proc/$PHP_PID/limits" ]]; then
              break
            fi
            sleep 0.2
          done

          if [[ -n "$PHP_PID" && -r "/proc/$PHP_PID/limits" ]]; then
            {
              echo "=== process ids ==="
              echo "E2E_PID=$E2E_PID"
              echo "PHP_PID=$PHP_PID"
              echo "=== PHP command line ==="
              tr '\0' ' ' < "/proc/$PHP_PID/cmdline"; echo
              echo "=== PHP executable ==="
              readlink -f "/proc/$PHP_PID/exe" || true
              echo "=== PHP cwd ==="
              readlink -f "/proc/$PHP_PID/cwd" || true
              echo "=== PHP limits ==="
              cat "/proc/$PHP_PID/limits"
              echo "=== PHP status ==="
              grep -E '^(Name|Pid|PPid|TracerPid|Uid|Gid|CoreDumping|NoNewPrivs|Seccomp):' "/proc/$PHP_PID/status" || true
              echo "=== PHP coredump_filter ==="
              cat "/proc/$PHP_PID/coredump_filter" || true
              echo "=== ancestry ==="
              CURRENT="$PHP_PID"
              for _ in $(seq 1 8); do
                [[ -r "/proc/$CURRENT/status" ]] || break
                NAME="$(awk '/^Name:/{print $2}' "/proc/$CURRENT/status")"
                PPID_VALUE="$(awk '/^PPid:/{print $2}' "/proc/$CURRENT/status")"
                printf 'pid=%s name=%s ppid=%s\n' "$CURRENT" "$NAME" "$PPID_VALUE"
                [[ "$PPID_VALUE" == "0" ]] && break
                CURRENT="$PPID_VALUE"
              done
            } | tee diagnostics/php-process.txt
          else
            echo "PHP web-server process was not found while E2E was running." | tee diagnostics/php-process-not-found.txt
          fi

          set +e
          wait "$E2E_PID"
          STATUS=$?
          set -e

          {
            echo "e2e_exit=$STATUS"
            echo "core_pattern final=$(cat /proc/sys/kernel/core_pattern)"
            echo "core files:"
            find "$GITHUB_WORKSPACE/core-dumps" -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null || true
          } | tee diagnostics/e2e-result.txt

          exit "$STATUS"

      - name: Analyze core post-mortem
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          CORES=("$GITHUB_WORKSPACE"/core-dumps/core.*)

          if (( ${#CORES[@]} == 0 )); then
            {
              echo "No core file was created."
              echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"
              echo "core_uses_pid=$(cat /proc/sys/kernel/core_uses_pid)"
            } | tee diagnostics/no-core.txt
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y gdb

          PHP_BIN="$(readlink -f "$(command -v php)")"
          for CORE in "${CORES[@]}"; do
            NAME="$(basename "$CORE")"
            {
              echo "=== core ==="
              ls -lh "$CORE"
              echo "=== executable ==="
              file "$PHP_BIN"
              echo "=== core metadata ==="
              file "$CORE"
              echo "=== gdb post-mortem ==="
              gdb --batch -q "$PHP_BIN" "$CORE" \
                -ex 'set pagination off' \
                -ex 'info files' \
                -ex 'info sharedlibrary' \
                -ex 'info registers' \
                -ex 'thread apply all bt full'
            } > "diagnostics/gdb-${NAME}.txt" 2>&1 || true
          done

      - name: Upload SIGSEGV diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-segfault-diagnostics-${{ github.sha }}
          path: |
            diagnostics/
            core-dumps/
            playwright-report/
            storage/logs/laravel.log
          if-no-files-found: warn
          retention-days: 7
