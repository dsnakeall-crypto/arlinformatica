name: Diagnose PHP SIGSEGV

on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto

jobs:
  analyze-captured-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Setup exact PHP 8.2 build with matching debug symbols
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, fileinfo, zip
          coverage: none
        env:
          debug: true

      - name: Download captured core artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_ARTIFACT_ID: '9891828050'
        run: |
          set -euo pipefail
          mkdir -p captured diagnostics
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CORE_ARTIFACT_ID}/zip" \
            -o /tmp/core-artifact.zip
          unzip -q /tmp/core-artifact.zip -d captured
          CORE="$(find captured/core-dumps -maxdepth 1 -type f -name 'core.*' -print -quit)"
          test -n "$CORE"
          { echo "artifact_id=$CORE_ARTIFACT_ID"; echo "core=$CORE"; ls -lh "$CORE"; file "$CORE"; } \
            | tee diagnostics/core-source.txt

      - name: Verify exact PHP binary and debug file
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN="$(readlink -f "$(command -v php)")"
          EXPECTED="$(grep -i 'Build ID:' captured/diagnostics/runtime-before.txt | tail -1 | sed -E 's/.*Build ID:[[:space:]]*//')"
          CURRENT="$(readelf -n "$PHP_BIN" 2>/dev/null | grep -i 'Build ID:' | tail -1 | sed -E 's/.*Build ID:[[:space:]]*//')"
          DEBUG_FILE="/usr/lib/debug/.build-id/${EXPECTED:0:2}/${EXPECTED:2}.debug"
          {
            echo "php_bin=$PHP_BIN"
            php -v
            echo "expected_build_id=$EXPECTED"
            echo "current_build_id=$CURRENT"
            echo "expected_debug_file=$DEBUG_FILE"
            if [[ -f "$DEBUG_FILE" ]]; then
              echo "debug_file_present=yes"
              file "$DEBUG_FILE"
              ls -lh "$DEBUG_FILE"
            else
              echo "debug_file_present=no"
            fi
          } | tee diagnostics/php-build-match.txt

          [[ -n "$EXPECTED" && "$CURRENT" == "$EXPECTED" ]] || exit 1
          [[ -f "$DEBUG_FILE" ]] || exit 1

          sudo apt-get update -qq
          sudo apt-get install -y gdb libc6-dbg

      - name: Inspect active PHP frame offline
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN="$(readlink -f "$(command -v php)")"
          CORE="$(find captured/core-dumps -maxdepth 1 -type f -name 'core.*' -print -quit)"
          gdb --batch -q "$PHP_BIN" "$CORE" \
            -ex 'set pagination off' \
            -ex 'set print pretty on' \
            -ex 'set debug-file-directory /usr/lib/debug' \
            -ex 'frame 0' \
            -ex 'p ((zend_execute_data *)$r14)->run_time_cache' \
            -ex 'p ((zend_execute_data *)$r14)->func->op_array.cache_size' \
            -ex 'p ((zend_execute_data *)$r14)->func->op_array.run_time_cache' \
            -ex 'p *((zend_execute_data *)$r14)->opline' \
            -ex 'p ((zend_execute_data *)$r14)->func->common.function_name' \
            -ex 'x/s ((zend_execute_data *)$r14)->func->common.function_name->val' \
            -ex 'p ((zend_execute_data *)$r14)->func->common.scope' \
            -ex 'x/s ((zend_execute_data *)$r14)->func->common.scope->name->val' \
            -ex 'p ((zend_execute_data *)$r14)->func->op_array.filename' \
            -ex 'x/s ((zend_execute_data *)$r14)->func->op_array.filename->val' \
            -ex 'p ((zend_class_entry *)$rbp)->name' \
            -ex 'x/s ((zend_class_entry *)$rbp)->name->val' \
            -ex 'p ((zend_execute_data *)$r14)->prev_execute_data' \
            -ex 'p ((zend_execute_data *)$r14)->prev_execute_data->func->common.function_name' \
            -ex 'x/s ((zend_execute_data *)$r14)->prev_execute_data->func->common.function_name->val' \
            -ex 'p ((zend_execute_data *)$r14)->prev_execute_data->func->op_array.filename' \
            -ex 'x/s ((zend_execute_data *)$r14)->prev_execute_data->func->op_array.filename->val' \
            -ex 'bt 12' \
            -ex 'quit' > diagnostics/zend-active-frame.txt 2>&1 || true
          cat diagnostics/zend-active-frame.txt

      - name: Upload focused Zend state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-segfault-zend-frame-89083ca2
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
