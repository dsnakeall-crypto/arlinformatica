name: Diagnose PHP SIGSEGV

on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto

jobs:
  analyze-carbon-repro-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Setup exact PHP 8.2 build with debug symbols
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
        env:
          debug: true

      - name: Download Carbon mini-repro core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_ARTIFACT_ID: '9893136466'
        run: |
          set -euo pipefail
          mkdir -p captured diagnostics
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CORE_ARTIFACT_ID}/zip" \
            -o /tmp/carbon-core.zip
          unzip -q /tmp/carbon-core.zip -d captured
          CORE="$(find captured/core-dumps-carbon -maxdepth 1 -type f -name 'core.*' -print -quit)"
          test -n "$CORE"
          {
            echo "artifact_id=$CORE_ARTIFACT_ID"
            echo "core=$CORE"
            ls -lh "$CORE"
            file "$CORE"
            echo '=== repro result ==='
            cat captured/diagnostics/carbon-cache/result.txt
            echo '=== repro server log ==='
            cat captured/diagnostics/carbon-cache/server.log
          } | tee diagnostics/core-source.txt

      - name: Verify PHP binary and symbols
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN="$(readlink -f "$(command -v php)")"
          BUILD_ID="$(readelf -n "$PHP_BIN" 2>/dev/null | grep -i 'Build ID:' | tail -1 | sed -E 's/.*Build ID:[[:space:]]*//')"
          DEBUG_FILE="/usr/lib/debug/.build-id/${BUILD_ID:0:2}/${BUILD_ID:2}.debug"
          {
            echo "php_bin=$PHP_BIN"
            php -v
            echo "build_id=$BUILD_ID"
            echo "debug_file=$DEBUG_FILE"
            test -f "$DEBUG_FILE" && echo 'debug_file_present=yes' || echo 'debug_file_present=no'
            file "$PHP_BIN"
            test -f "$DEBUG_FILE" && file "$DEBUG_FILE" || true
          } | tee diagnostics/php-build.txt
          test -n "$BUILD_ID"
          test -f "$DEBUG_FILE"
          sudo apt-get update -qq
          sudo apt-get install -y gdb libc6-dbg

      - name: Extract Carbon mini-repro backtrace offline
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN="$(readlink -f "$(command -v php)")"
          CORE="$(find captured/core-dumps-carbon -maxdepth 1 -type f -name 'core.*' -print -quit)"
          gdb --batch -q "$PHP_BIN" "$CORE" \
            -ex 'set pagination off' \
            -ex 'set print pretty on' \
            -ex 'set debug-file-directory /usr/lib/debug' \
            -ex 'info files' \
            -ex 'info sharedlibrary' \
            -ex 'info registers' \
            -ex 'x/16i $pc-32' \
            -ex 'frame 0' \
            -ex 'p ((zend_execute_data *)$r14)->func->common.function_name' \
            -ex 'x/s ((zend_execute_data *)$r14)->func->common.function_name->val' \
            -ex 'p ((zend_execute_data *)$r14)->func->op_array.filename' \
            -ex 'x/s ((zend_execute_data *)$r14)->func->op_array.filename->val' \
            -ex 'p ((zend_execute_data *)$r14)->prev_execute_data' \
            -ex 'p ((zend_execute_data *)$r14)->prev_execute_data->func->common.function_name' \
            -ex 'x/s ((zend_execute_data *)$r14)->prev_execute_data->func->common.function_name->val' \
            -ex 'p ((zend_execute_data *)$r14)->prev_execute_data->func->op_array.filename' \
            -ex 'x/s ((zend_execute_data *)$r14)->prev_execute_data->func->op_array.filename->val' \
            -ex 'thread apply all bt full' \
            -ex 'quit' > diagnostics/carbon-core-gdb.txt 2>&1 || true
          {
            echo '=== SIGNAL / TOP FRAMES ==='
            grep -E 'Program terminated|^#0 |^#1 |^#2 |^#3 |^#4 |^#5 |ZEND_|Carbon|Creator.php' diagnostics/carbon-core-gdb.txt | head -160 || true
            echo '=== FULL TRACE ==='
            cat diagnostics/carbon-core-gdb.txt
          } | tee diagnostics/carbon-core-summary.txt

      - name: Upload Carbon core analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbon-mini-core-analysis-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
