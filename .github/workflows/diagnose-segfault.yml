name: Diagnose PHP SIGSEGV

on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto

jobs:
  analyze-captured-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, fileinfo, zip
          coverage: none

      - name: Download captured core artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_ARTIFACT_ID: '9891828050'
        run: |
          set -euo pipefail
          mkdir -p captured diagnostics
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CORE_ARTIFACT_ID}/zip" \
            -o /tmp/core-artifact.zip
          unzip -q /tmp/core-artifact.zip -d captured
          CORE="$(find captured/core-dumps -maxdepth 1 -type f -name 'core.*' -print -quit)"
          test -n "$CORE"
          { echo "artifact_id=$CORE_ARTIFACT_ID"; echo "core=$CORE"; ls -lh "$CORE"; file "$CORE"; } \
            | tee diagnostics/core-source.txt

      - name: Verify exact PHP build and prepare symbols
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN="$(readlink -f "$(command -v php)")"
          EXPECTED="$(grep -i 'Build ID:' captured/diagnostics/runtime-before.txt | tail -1 | sed -E 's/.*Build ID:[[:space:]]*//')"
          CURRENT="$(readelf -n "$PHP_BIN" 2>/dev/null | grep -i 'Build ID:' | tail -1 | sed -E 's/.*Build ID:[[:space:]]*//')"
          VERSION="$(dpkg-query -W -f='${Version}' php8.2-cli)"
          {
            echo "php_bin=$PHP_BIN"
            php -v
            echo "php_package_version=$VERSION"
            echo "expected_build_id=$EXPECTED"
            echo "current_build_id=$CURRENT"
          } | tee diagnostics/php-build-match.txt
          [[ -n "$EXPECTED" && "$CURRENT" == "$EXPECTED" ]] || { echo 'BUILD ID MISMATCH' | tee -a diagnostics/php-build-match.txt; exit 1; }

          sudo apt-get update -qq
          sudo apt-get install -y gdb
          mkdir -p /tmp/php-dbgsym /tmp/debug-root
          BASE='https://ppa.launchpadcontent.net/ondrej/php/ubuntu/pool/main/p/php8.2'
          for COMPONENT in cli common sqlite3 gd zip mbstring; do
            FILE="php8.2-${COMPONENT}-dbgsym_${VERSION}_amd64.ddeb"
            if curl --fail --location --silent --show-error "$BASE/$FILE" -o "/tmp/php-dbgsym/$FILE"; then
              dpkg-deb -x "/tmp/php-dbgsym/$FILE" /tmp/debug-root
              echo "debug_symbols_extracted=$FILE" | tee -a diagnostics/php-build-match.txt
            else
              echo "debug_symbols_unavailable=$FILE" | tee -a diagnostics/php-build-match.txt
            fi
          done
          find /tmp/debug-root/usr/lib/debug -type f -printf '%p %s bytes\n' 2>/dev/null | sort \
            > diagnostics/debug-symbol-files.txt || true

      - name: Extract full native backtrace offline
        shell: bash
        env:
          DEBUGINFOD_URLS: https://debuginfod.ubuntu.com
        run: |
          set -euo pipefail
          PHP_BIN="$(readlink -f "$(command -v php)")"
          CORE="$(find captured/core-dumps -maxdepth 1 -type f -name 'core.*' -print -quit)"
          gdb --batch -q "$PHP_BIN" "$CORE" \
            -ex 'set pagination off' \
            -ex 'set print pretty on' \
            -ex 'set debuginfod enabled on' \
            -ex 'set debug-file-directory /tmp/debug-root/usr/lib/debug:/usr/lib/debug' \
            -ex 'info files' \
            -ex 'info sharedlibrary' \
            -ex 'info registers' \
            -ex 'x/16i $pc-32' \
            -ex 'thread apply all bt full' \
            -ex 'quit' > diagnostics/gdb-backtrace.txt 2>&1 || true
          { sed -n '1,140p' diagnostics/gdb-backtrace.txt; echo '=== FRAMES ==='; grep -E '^#[0-9]+' diagnostics/gdb-backtrace.txt | head -120 || true; } \
            | tee diagnostics/gdb-summary.txt

      - name: Upload post-mortem backtrace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-segfault-backtrace-89083ca2
          path: diagnostics/
          if-no-files-found: error
          retention-days: 7
