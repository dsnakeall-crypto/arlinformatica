name: Diagnose PHP SIGSEGV

on:
  push:
    branches:
      - codex/implementar-etapa-10-do-projeto

jobs:
  extension-bisect:
    name: PHP 8.2.33 extension bisection / Carbon alternate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2.33
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.33'
          extensions: mbstring, sqlite3, pdo_sqlite, gd, fileinfo, zip
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Bisect loaded extensions with fresh processes
        shell: bash
        run: |
          set -uo pipefail
          DIAG="$GITHUB_WORKSPACE/diagnostics/extension-bisect"
          mkdir -p "$DIAG"
          ulimit -c 0

          php -v | tee "$DIAG/php-version.txt"
          php --ini | tee "$DIAG/php-ini.txt"
          php -m | tee "$DIAG/modules-all.txt"
          php -r 'printf("opcache.enable=%s\nopcache.enable_cli=%s\nopcache.jit=%s\nopcache.jit_buffer_size=%s\napc.enable_cli=%s\nextension_dir=%s\n", var_export(ini_get("opcache.enable"), true), var_export(ini_get("opcache.enable_cli"), true), var_export(ini_get("opcache.jit"), true), var_export(ini_get("opcache.jit_buffer_size"), true), var_export(ini_get("apc.enable_cli"), true), ini_get("extension_dir"));' | tee "$DIAG/runtime-flags.txt"

          SCAN_DIR=$(php --ini | sed -n 's/^Scan for additional .ini files in: *//p')
          if [[ -z "$SCAN_DIR" || ! -d "$SCAN_DIR" ]]; then
            echo "Unable to resolve PHP scan dir: '$SCAN_DIR'" >&2
            exit 1
          fi
          echo "scan_dir=$SCAN_DIR" | tee "$DIAG/scan-dir.txt"
          ls -la "$SCAN_DIR" | tee "$DIAG/conf-all.txt"

          cat > "$DIAG/router.php" <<'PHP'
          <?php
          require dirname(__DIR__, 2).'/vendor/autoload.php';
          use Carbon\Carbon;
          use Carbon\CarbonImmutable;
          header('Content-Type: application/json');
          $iterations = max(1, min((int) ($_GET['n'] ?? 5000), 10000));
          $format = 'Y-m-d H:i:s';
          $value = '2026-09-01 00:00:00';
          $timezone = 'America/Sao_Paulo';
          for ($i = 0; $i < $iterations; $i++) {
              $mutable = Carbon::createFromFormat($format, $value, $timezone);
              $immutable = CarbonImmutable::createFromFormat($format, $value, $timezone);
              if ($mutable->format('Y-m-d') !== '2026-09-01' || $immutable->format('Y-m-d') !== '2026-09-01') {
                  throw new RuntimeException('date mismatch');
              }
          }
          echo json_encode(['ok' => true, 'pid' => getmypid(), 'iterations' => $iterations]);
          PHP

          declare -A EXCLUDES
          EXCLUDES[all]=''
          EXCLUDES[minus-opcache]='opcache'
          EXCLUDES[minus-apcu]='apcu'
          EXCLUDES[minus-intl]='intl'
          EXCLUDES[minus-mbstring]='mbstring'
          EXCLUDES[minus-gd]='gd'
          EXCLUDES[minus-zip]='zip'
          EXCLUDES[minus-sqlite]='sqlite3|pdo_sqlite'

          : > "$DIAG/results.txt"

          for CASE in all minus-opcache minus-apcu minus-intl minus-mbstring minus-gd minus-zip minus-sqlite; do
            CASE_DIR="$DIAG/$CASE"
            CASE_SCAN="$CASE_DIR/conf.d"
            mkdir -p "$CASE_SCAN"
            PATTERN="${EXCLUDES[$CASE]}"

            for INI in "$SCAN_DIR"/*.ini; do
              BASE=$(basename "$INI")
              if [[ -n "$PATTERN" ]] && [[ "$BASE" =~ $PATTERN ]]; then
                continue
              fi
              ln -s "$INI" "$CASE_SCAN/$BASE"
            done

            PHP_INI_SCAN_DIR="$CASE_SCAN" php -m > "$CASE_DIR/modules.txt"
            PHP_INI_SCAN_DIR="$CASE_SCAN" php -r 'printf("opcache.enable=%s opcache.enable_cli=%s apc.enable_cli=%s\n", var_export(ini_get("opcache.enable"), true), var_export(ini_get("opcache.enable_cli"), true), var_export(ini_get("apc.enable_cli"), true));' > "$CASE_DIR/flags.txt"

            CRASHES=0
            PASSES=0
            for REP in 1 2 3; do
              PORT=$((8090 + REP))
              REP_DIR="$CASE_DIR/rep-$REP"
              mkdir -p "$REP_DIR"
              PHP_INI_SCAN_DIR="$CASE_SCAN" php -d opcache.enable_cli=0 -S "127.0.0.1:$PORT" "$DIAG/router.php" > "$REP_DIR/server.log" 2>&1 &
              SERVER_PID=$!

              READY=0
              for _ in $(seq 1 50); do
                set +e
                curl --max-time 2 -fsS "http://127.0.0.1:$PORT/?n=1" > "$REP_DIR/readiness.json" 2> "$REP_DIR/readiness.err"
                READY_STATUS=$?
                set -e
                if [[ $READY_STATUS -eq 0 ]]; then READY=1; break; fi
                sleep 0.1
              done

              if [[ $READY -ne 1 ]]; then
                echo "$CASE rep=$REP readiness_failed=1" | tee -a "$DIAG/results.txt"
                set +e; kill "$SERVER_PID" 2>/dev/null; wait "$SERVER_PID" 2>/dev/null; set -e
                continue
              fi

              FAILED=0
              ATTEMPTED=0
              LAST_STATUS=0
              for REQUEST in $(seq 1 50); do
                ATTEMPTED=$REQUEST
                set +e
                curl --max-time 20 -fsS "http://127.0.0.1:$PORT/?n=5000" > "$REP_DIR/response.json" 2> "$REP_DIR/curl.err"
                LAST_STATUS=$?
                set -e
                if [[ $LAST_STATUS -ne 0 ]]; then
                  FAILED=1
                  break
                fi
              done

              sleep 0.2
              set +e
              if kill -0 "$SERVER_PID" 2>/dev/null; then kill "$SERVER_PID" 2>/dev/null; fi
              wait "$SERVER_PID"
              WAIT_STATUS=$?
              set -e

              if [[ $FAILED -eq 1 || $WAIT_STATUS -eq 139 ]]; then
                CRASHES=$((CRASHES + 1))
              else
                PASSES=$((PASSES + 1))
              fi
              echo "$CASE rep=$REP attempted=$ATTEMPTED failed=$FAILED curl_exit=$LAST_STATUS wait_status=$WAIT_STATUS" | tee -a "$DIAG/results.txt"
            done
            echo "$CASE summary crashes=$CRASHES passes=$PASSES excluded='$PATTERN'" | tee -a "$DIAG/results.txt"
          done

      - name: Upload extension bisection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-bisect-php-8.2.33-${{ github.sha }}
          path: diagnostics/extension-bisect/
          if-no-files-found: warn
          retention-days: 7
