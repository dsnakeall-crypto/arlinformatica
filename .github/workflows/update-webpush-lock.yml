name: Temporary Web Push Lock

on:
  push:
    branches:
      - codex/implementar-etapa-8-backup-e-web-push
    paths:
      - .github/workflows/update-webpush-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-etapa-8-backup-e-web-push
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Add Web Push dependency
        run: composer require minishlink/web-push --no-interaction --no-scripts --with-all-dependencies
      - name: Commit composer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git commit -m "build: adicionar dependência Web Push" || exit 0
          git push origin HEAD:codex/implementar-etapa-8-backup-e-web-push
